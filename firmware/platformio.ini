; ============================================================================
;  晚安成电自动打卡终端 · PlatformIO 工程配置
;  **一份代码，多个构建目标**（目标只按**板子**分，不再按单人/多人分）：
;    · esp32-s3-devkitc-1  → ESP32-S3-N16R8（16 MB Flash + 8 MB OPI PSRAM）【默认】
;    · esp32-wroom-32             → 经典 ESP32-WROOM-32（4 MB Flash，无 PSRAM），端口用 --upload-port 指定
;  打几个人由**账号表**决定：表里 1 条 = 单人，6 条 = 多人，空表 = 用设备自身 auth+loc。
;  框架：Arduino-ESP32 2.0.17（PlatformIO 框架包版本号不等于 Arduino 运行库版本）
;  设计依据：docs/firmware-design.md、docs/multi-user-design.md
;
;  用法：
;    VSCode 侧边栏 PlatformIO → 环境选择器切到目标板，Build/Upload 只作用于它；
;    命令行：  pio run -e esp32-s3-devkitc-1 -t upload --upload-port COM5
;    提示：不带 -e 的 `pio run` 会构建**全部** env（需要对应工具链都已装好）。
;
;  共用设置放在 [env] 里，各板差异写在各自的 [env:xxx] 段。
; ============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------- 共用配置
[env]
extra_scripts = post:scripts/build_metadata.py
board_build.flash_mode = dio
board_build.f_flash = 80000000L
framework = arduino
platform  = espressif32@7.1.3

upload_speed  = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  ; BLE 回调栈留足余量（指令已改到 net_task 执行，这里是双保险）
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

lib_deps =
  h2zero/NimBLE-Arduino @ 2.5.1
  bblanchon/ArduinoJson  @ 7.4.3

; ---------------------------------------------------------------- ESP32-S3
; 目标硬件：ESP32-S3-N16R8（16 MB QIO Flash + 8 MB Octal PSRAM）
; LED：板载 WS2812 @ GPIO48（app_types.h 按芯片自动选择）
[env:esp32-s3-devkitc-1]
board     = esp32-s3-devkitc-1
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions          = partitions/partitions_16mb.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DWANAN_BOARD_ID=\"s3-n16r8\"
  -DWANAN_LED_PIN=48
  -DWANAN_LED_IS_RGB=1
  ; 原生 USB：CDC 默认关闭（用 COM 口烧录/监视）；改 1 则 Serial 走 USB-C
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
; 板子显示为 "USB 串行设备 (COM5)"。端口变了就改这两行，或注释掉让 PlatformIO 自动探测。
; upload_port   = COM5
; monitor_port  = COM5

; 4 MB Flash 用 partitions/partitions_4mb.csv：双槽各 0x1F0000（2,031,616 B），保留 OTA 能力。
; ★ 分区表改动后必须整片重刷（PlatformIO 会一并刷 partitions.bin）；旧表留在设备上时
;    新固件可能装不进对应槽位。
[env:esp32-wroom-32]
board_build.f_flash = 40000000L
board     = esp32dev
board_build.flash_size    = 4MB
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.partitions    = partitions/partitions_4mb.csv
build_flags =
  ${env.build_flags}
  -DWANAN_BOARD_ID=\"wroom32-4mb\"
  -DWANAN_LED_PIN=2
  -DWANAN_LED_IS_RGB=0
  ; 经典 ESP32 没有 USB-Serial/JTAG，绝不能定义 ARDUINO_USB_* / BOARD_HAS_PSRAM
; 若同时插了多块板，写死端口更保险（pio device list 查；或用 --upload-port 覆盖）

; 单人 / 多人**不再是两种构建**：账号表里有几条就打几个，
; 表为空时自动退回设备自身配置（auth + loc）。所以这里不再有 -DWANAN_MULTIUSER 的 env。

; Additional targets are experimental: no physical validation. Report results
; with board/module markings, memory size, firmware version and redacted logs.
[env:esp32-wrover-4mb]
board = esp-wrover-kit
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions/partitions_4mb.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DWANAN_BOARD_ID=\"wrover-4mb\"
  -DWANAN_LED_PIN=-1
  -DWANAN_LED_IS_RGB=0

[env:esp32-s3-n8]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/partitions_8mb.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWANAN_BOARD_ID=\"s3-n8\"
  -DWANAN_LED_PIN=48
  -DWANAN_LED_IS_RGB=1

[env:esp32-s3-n8r8]
extends = env:esp32-s3-n8
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWANAN_BOARD_ID=\"s3-n8r8\"
  -DWANAN_LED_PIN=48
  -DWANAN_LED_IS_RGB=1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions/partitions_4mb.csv
build_flags =
  ${env.build_flags}
  -DWANAN_BOARD_ID=\"c3-devkitm-1-4mb\"
  -DWANAN_LED_PIN=8
  -DWANAN_LED_IS_RGB=1
