; ============================================================================
;  晚安成电自动打卡终端 · PlatformIO 工程配置
;  **一份代码，多个构建目标**：
;    · esp32-s3-devkitc-1  → ESP32-S3-N16R8（16 MB Flash + 8 MB OPI PSRAM）**单人版**【默认】
;    · esp32-s3-multiuser  → 同一块 S3，加 -DWANAN_MULTIUSER=1，**多人顺序打卡版**
;    · esp32-wroom-32-a/b  → 经典 ESP32-WROOM-32（4 MB Flash，无 PSRAM），两块分别绑 COM6/COM7
;  框架：Arduino-ESP32 3.x
;  设计依据：docs/firmware-design.md
;
;  用法：
;    VSCode 侧边栏 PlatformIO → 环境选择器切到目标板，Build/Upload 只作用于它；
;    命令行：  pio run -e esp32-s3-devkitc-1 -t upload --upload-port COM5
;    提示：default_envs 目前被注释掉 → 不带 -e 的 `pio run` 会构建**全部** env；
;          等你把 wroom-32 段粘回来之后，建议取消 default_envs 的注释，避免误建两个目标。
;
;  共用设置放在 [env] 里，各板差异写在各自的 [env:xxx] 段。
; ============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------- 共用配置
[env]
framework = arduino
platform  = espressif32

upload_speed  = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  ; BLE 回调栈留足余量（指令已改到 net_task 执行，这里是双保险）
  -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

lib_deps =
  h2zero/NimBLE-Arduino @ ^2.1.0
  bblanchon/ArduinoJson  @ ^7.2.0

; ---------------------------------------------------------------- ESP32-S3
; 目标硬件：ESP32-S3-N16R8（16 MB QIO Flash + 8 MB Octal PSRAM）
; LED：板载 WS2812 @ GPIO48（app_types.h 按芯片自动选择）
[env:esp32-s3-devkitc-1]
board     = esp32-s3-devkitc-1
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions          = partitions/partitions_16mb.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  ; 原生 USB：CDC 默认关闭（用 COM 口烧录/监视）；改 1 则 Serial 走 USB-C
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
; 板子显示为 "USB 串行设备 (COM5)"。端口变了就改这两行，或注释掉让 PlatformIO 自动探测。
;upload_port   = COM5
;monitor_port  = COM5

; ---------------------------------------------------------------- 经典 ESP32
[env:esp32-wroom-32-a]
board     = esp32dev
board_build.flash_size    = 4MB
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.partitions    = partitions/partitions_4mb.csv
build_flags =
  ${env.build_flags}
  ; 经典 ESP32 没有 USB-Serial/JTAG，绝不能定义 ARDUINO_USB_* / BOARD_HAS_PSRAM
; 若同时插了多块板，写死端口更保险（pio device list 查；或用 --upload-port 覆盖）
;upload_port   = COM6
;monitor_port  = COM6

; ---------------------------------------------------------------- 经典 ESP32
[env:esp32-wroom-32-b]
board     = esp32dev
board_build.flash_size    = 4MB
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.partitions    = partitions/partitions_4mb.csv
build_flags =
  ${env.build_flags}
  ; 经典 ESP32 没有 USB-Serial/JTAG，绝不能定义 ARDUINO_USB_* / BOARD_HAS_PSRAM
; 若同时插了多块板，写死端口更保险（pio device list 查；或用 --upload-port 覆盖）
;upload_port   = COM7
;monitor_port  = COM7

; ---------------------------------------------------------------- ESP32-S3 多人版
; 与单人版**同一份代码**，只多一个编译宏：
;   · -DWANAN_MULTIUSER=1 → 多人顺序打卡**默认开启**（用 multi.set 关掉就完全等同单人行为）
;   · 版本号显示为 0.2.0-multi，便于从 hello 回执区分两个版本
;   · 同一块 S3 板可在两个 env 间来回刷，NVS 里的配置/账号表不会丢
;   · 不需要额外工具链（板子与单人版相同），任务树不会卡
[env:esp32-s3-multiuser]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -DWANAN_MULTIUSER=1
